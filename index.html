<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7453de">
  <title>TiFcifre — Numără și alege</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');
    :root{--ink:#29234c;--violet:#7453de;--deep:#4e31a9;--mint:#39bf88;--gold:#ffc63e;--pink:#f25f93;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:Fredoka,ui-rounded,system-ui,sans-serif;background:radial-gradient(circle at 8% 9%,#fff 0 8%,transparent 25%),radial-gradient(circle at 94% 90%,#ffda65 0 7%,transparent 24%),linear-gradient(135deg,#e9e0ff,#e6f8f3 54%,#fff2c9);user-select:none;-webkit-user-select:none}main{width:min(1060px,100%);min-height:100dvh;margin:auto;padding:clamp(16px,4vw,38px) clamp(13px,4vw,42px) max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:clamp(14px,3vh,27px)}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{margin:0;color:var(--deep);font-size:clamp(31px,5vw,51px);line-height:.95}.subtitle{margin:6px 0 0;color:#635c87;font-size:clamp(15px,2.5vw,20px)}.score{display:flex;gap:8px}.badge{min-width:80px;padding:7px 12px;border:3px solid #fff;border-radius:17px;background:#ffffffcf;box-shadow:0 5px 0 #493c7b22;text-align:center;color:#665d89;font-size:14px;font-weight:700}.badge b{display:block;color:var(--deep);font-size:27px;line-height:1}.levels{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.level{border:0;border-radius:999px;padding:8px 15px;background:#fff;color:#605684;box-shadow:0 4px 0 #50446d20;cursor:pointer;font:700 clamp(14px,2.5vw,17px)/1 Fredoka,sans-serif}.level.active{color:#fff;background:var(--violet);box-shadow:0 4px 0 var(--deep)}.level:focus-visible,.choice:focus-visible{outline:4px solid var(--gold);outline-offset:3px}.game{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(250px,.72fr);gap:clamp(14px,4vw,38px);flex:1;min-height:390px}.panel{border:5px solid #ffffffcf;border-radius:32px;background:#ffffffb8;box-shadow:0 11px 0 #4d407c1d,0 18px 34px #3e317522;overflow:hidden}.scene{display:flex;flex-direction:column;min-height:0}.question{align-self:center;margin:16px 16px 0;padding:7px 16px;border-radius:999px;background:var(--violet);box-shadow:0 4px 0 var(--deep);color:#fff;font-size:clamp(16px,2.8vw,22px);font-weight:700;text-align:center}.things{position:relative;flex:1;min-height:280px;margin:8px 18px 19px;display:grid;grid-template-columns:repeat(5,1fr);place-items:center;align-content:center;gap:clamp(8px,2vw,17px);padding:10px}.thing{display:grid;place-items:center;width:clamp(42px,8vw,77px);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#fff,#fff8d9);box-shadow:inset 0 -5px 0 #d6c36c33,0 6px 0 #877c4c22;font-size:clamp(30px,6.5vw,58px);animation:pop .3s backwards cubic-bezier(.2,1.5,.4,1)}.answers{display:flex;flex-direction:column;align-items:center;padding:16px}.answers h2{margin:3px 0 13px;color:#287c9e;font-size:clamp(17px,3vw,22px)}.choices{display:flex;flex:1;width:100%;flex-direction:column;justify-content:center;gap:clamp(12px,3vh,21px)}.choice{min-height:clamp(72px,14vh,116px);border:0;border-radius:26px;color:#fff;cursor:pointer;font:700 clamp(42px,8vw,72px)/1 Fredoka,sans-serif;text-shadow:0 3px 0 #0002;box-shadow:0 7px 0 #283b7b38,0 12px 17px #3a4d8725;transition:transform .12s,filter .12s}.choice:nth-child(1){background:linear-gradient(#6bd2ff,#258bd4)}.choice:nth-child(2){background:linear-gradient(#ff95bd,#e74782)}.choice:nth-child(3){background:linear-gradient(#a78bff,#6c4edb)}.choice:hover{filter:brightness(1.05);transform:translateY(-3px)}.choice:active{transform:translateY(5px);box-shadow:0 2px 0 #283b7b38}.status{min-height:30px;margin:0;text-align:center;color:#5c547b;font-size:clamp(16px,2.7vw,20px);font-weight:700}.feedback{position:fixed;z-index:5;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .15s}.feedback.show{opacity:1}.bubble{padding:18px 27px;border:6px solid;border-radius:28px;background:#fffc;font-size:clamp(33px,8vw,70px);font-weight:700;box-shadow:0 12px 35px #2d24534d;transform:scale(.7);transition:transform .2s cubic-bezier(.2,1.5,.4,1)}.show .bubble{transform:scale(1)}.correct .bubble{color:#168153;border-color:#77dca3}.wrong .bubble{color:#d34065;border-color:#ff9bb5}.confetti{position:fixed;z-index:4;top:50%;left:50%;width:12px;height:12px;border-radius:3px;background:var(--c);pointer-events:none;animation:boom 1.35s both cubic-bezier(.12,.75,.28,1)}.confetti.star{width:auto;height:auto;background:none;color:var(--c);font-size:clamp(20px,4vw,38px)}@keyframes pop{from{opacity:0;transform:scale(0)}}@keyframes boom{0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(.4)}72%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1.15)}}@media(max-width:680px){body{overflow:hidden}main{height:100dvh;min-height:0;gap:10px;padding:max(9px,env(safe-area-inset-top)) 11px max(9px,env(safe-area-inset-bottom))}header{gap:9px}h1{font-size:clamp(27px,8vw,35px)}.subtitle{font-size:clamp(12px,3.8vw,15px);line-height:1.15}.score{gap:4px}.badge{min-width:53px;padding:5px 5px;font-size:10px}.badge b{font-size:22px}.levels{gap:6px}.level{padding:7px 11px;font-size:13px}.game{min-height:0;grid-template-columns:minmax(0,1.18fr) minmax(0,.82fr);gap:9px}.panel{border-width:3px;border-radius:21px}.question{margin:9px 6px 0;padding:5px 7px;font-size:clamp(11px,3.3vw,15px);box-shadow:0 3px 0 var(--deep)}.things{min-height:0;margin:5px 7px 9px;gap:7px;padding:4px}.thing{width:clamp(27px,9vw,42px);font-size:clamp(21px,7.2vw,34px);box-shadow:inset 0 -3px 0 #d6c36c33,0 3px 0 #877c4c22}.answers{padding:7px}.answers h2{margin:1px 0 6px;font-size:clamp(11px,3.5vw,15px)}.choices{gap:9px}.choice{min-height:0;flex:1;border-radius:17px;font-size:clamp(34px,13vw,54px);box-shadow:0 4px 0 #283b7b38}.status{min-height:18px;font-size:clamp(13px,3.8vw,16px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>TiFcifre</h1><p class="subtitle">Numără și alege cifra potrivită!</p></div><div class="score"><div class="badge">CORECTE<b id="correct">0</b></div><div class="badge">GREȘITE<b id="wrong">0</b></div><div class="badge">SERIE<b id="streak">0</b></div></div></header>
    <nav class="levels" aria-label="Alege nivelul"><button class="level active" data-max="5" type="button">1 – 5</button><button class="level" data-max="10" type="button">1 – 10</button><button class="level" data-max="20" type="button">1 – 20</button></nav>
    <section class="game" aria-label="Joc de numărat"><section class="panel scene"><div class="question" id="question">CÂTE LUCRURI VEZI?</div><div class="things" id="things" aria-live="polite"></div></section><section class="panel answers"><h2>ALEGE CIFRA</h2><div class="choices" id="choices"></div></section></section>
    <p class="status" id="status" aria-live="polite">Privește cu atenție și numără!</p>
  </main>
  <div class="feedback" id="feedback" aria-live="assertive"><div class="bubble" id="bubble"></div></div><audio id="trumpet" preload="auto" src="assets/trumpet.ogg"></audio>
  <script>
    (()=>{const things=document.querySelector('#things'),choices=document.querySelector('#choices'),correctEl=document.querySelector('#correct'),wrongEl=document.querySelector('#wrong'),streakEl=document.querySelector('#streak'),status=document.querySelector('#status'),feedback=document.querySelector('#feedback'),bubble=document.querySelector('#bubble'),question=document.querySelector('#question'),trumpet=document.querySelector('#trumpet');let max=5,answer=0,correct=0,wrong=0,streak=0,locked=false,audio;const items=[['🍎','MERE'],['⭐','STELUȚE'],['🐞','BUBURUZE'],['🌼','FLORI'],['🚗','MAȘINUȚE'],['🎈','BALOANE']];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const shuffle=a=>a.sort(()=>Math.random()-.5);function chime(ok){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio??=new C();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;(ok?[523,659,784]:[220,170]).forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.11,now+i*.1+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.2);o.connect(g).connect(audio.destination);o.start(now+i*.1);o.stop(now+i*.1+.22)})}function fireworks(){const colors=['#ff3d7f','#ffd23f','#4dd995','#56b9ff','#a981ff','#ff792e'];for(let i=0;i<62;i++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=90+Math.random()*310;p.className=i%5===0?'confetti star':'confetti';p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');p.style.setProperty('--r',rand(180,860)+'deg');if(i%5===0)p.textContent='★';document.body.append(p);setTimeout(()=>p.remove(),1400)}}function celebrate(){fireworks();trumpet.pause();trumpet.currentTime=0;trumpet.volume=.8;trumpet.play().catch(()=>{});chime(true)}function round(){locked=false;answer=rand(1,max);const item=items[rand(0,items.length-1)];question.textContent=`CÂTE ${item[1]} VEZI?`;things.innerHTML='';for(let i=0;i<answer;i++){const el=document.createElement('span');el.className='thing';el.textContent=item[0];el.style.animationDelay=(i*.035)+'s';things.append(el)}things.setAttribute('aria-label',`${answer} ${item[1].toLowerCase()}`);const opts=new Set([answer]);while(opts.size<3)opts.add(rand(1,max));choices.innerHTML='';shuffle([...opts]).forEach(n=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=n;b.setAttribute('aria-label',`Cifra ${n}`);b.addEventListener('click',()=>pick(n));choices.append(b)});status.textContent='Privește cu atenție și numără!'}function pick(n){if(locked)return;locked=true;const ok=n===answer;if(ok){correct++;streak++;correctEl.textContent=correct;streakEl.textContent=streak;bubble.textContent=streak>=5?'SUPER SERIE! 🌟':'BRAVO! 🎺';feedback.className='feedback correct show';status.textContent='Ai numărat foarte bine!';celebrate()}else{wrong++;streak=0;wrongEl.textContent=wrong;streakEl.textContent=streak;bubble.textContent='MAI ÎNCEARCĂ! 💪';feedback.className='feedback wrong show';status.textContent='Numără încă o dată, poți reuși!';chime(false)}setTimeout(()=>{feedback.className='feedback';round()},ok?1450:1050)}document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>{max=+b.dataset.max;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x===b));round()}));round()})();
  </script>
</body>
</html>
